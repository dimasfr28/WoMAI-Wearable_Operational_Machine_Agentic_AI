services:
  # Internal-only (no Traefik labels, not on dokploy-network) — only `backend`
  # talks to these, over the default network. Same split rationale as
  # dev.compose.yaml: keeps backend rebuilds from invalidating these images'
  # multi-hundred-MB model download layers.
  mineru-service:
    build:
      context: ./mineru-service
      dockerfile: Dockerfile.prod
    volumes:
      - mineru_cache:/app/.cache
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile.prod
    volumes:
      - embedding_cache:/app/.cache
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: .env
    volumes:
      - backend_saved:/app/saved
      - pdf_library:/data/pdf_library
      # Was mounted at /app/reports, stale from before REPORTS_DIR
      # (app/config.py) moved to /data/reports — the volume sat unused at
      # the old path while every actual write to /data/reports landed on
      # the container's ephemeral layer, wiped on every recreate while
      # MachineReport DB rows (Supabase) kept pointing at the missing files.
      - machine_reports:/data/reports
    # Alibaba part-price scraping runs Chromium via Playwright IN-PROCESS
    # (backend/app/rag/part_price_search.py) — SYS_ADMIN capability needed for
    # Chromium's sandbox to work inside a container without --no-sandbox.
    cap_add:
      - SYS_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
      mineru-service:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comfest-backend.rule=Host(`${BACKEND_DOMAIN}`)"
      - "traefik.http.routers.comfest-backend.entrypoints=websecure"
      - "traefik.http.routers.comfest-backend.tls.certResolver=letsencrypt"
      - "traefik.http.services.comfest-backend.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comfest-frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.comfest-frontend.entrypoints=websecure"
      - "traefik.http.routers.comfest-frontend.tls.certResolver=letsencrypt"
      - "traefik.http.services.comfest-frontend.loadbalancer.server.port=3000"

networks:
  dokploy-network:
    external: true

volumes:
  backend_saved:
  pdf_library:
  machine_reports:
  mineru_cache:
  embedding_cache:
